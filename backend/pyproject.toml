[project]
name = "kifu-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
    "pytesseract==0.3.13",
    "opencv-python-headless==4.13.0.92",
    "numpy==2.2.6",
]

[project.optional-dependencies]
build = ["pybind11>=2.11"]

[tool.setuptools]
py-modules = ["main", "ocr_baseline"]