name: build-and-deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ ninja-build libopencv-dev
        python -m pip install --upgrade pip
        pip install pybind11

    - name: Build backend (_kifu_core.so)
      working-directory: backend
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
        cmake --build build

    - name: Build frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Download OCR models
      run: |
        set -euo pipefail

        mkdir -p backend/models

        curl -fL --retry 3 \
          -o backend/models/mnist-8.onnx \
          "https://huggingface.co/onnxmodelzoo/mnist-8/resolve/main/mnist-8.onnx"

        curl -fL --retry 3 \
          -o backend/models/text_recognition_CRNN_EN_2021sep.onnx \
          "https://huggingface.co/opencv/text_recognition_crnn/resolve/main/text_recognition_CRNN_EN_2021sep.onnx"

        test "$(stat -c%s backend/models/mnist-8.onnx)" -gt 20000

        echo "a84b1f6e11a65c2d733cb0cc1f014aae3f99051e3f11447dc282faa678eee544  backend/models/text_recognition_CRNN_EN_2021sep.onnx" | sha256sum -c -

    - name: Copy backend to server via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "backend/main.py,backend/ocr_baseline.py,backend/compare_digits.py,backend/pyproject.toml,backend/_kifu_core*.so,backend/models/*.onnx"
        strip_components: 1

    - name: Copy frontend to server via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "frontend/dist/*"
        target: "/var/www/kifu_to_sgf/frontend_dist"
        strip_components: 2

    - name: Install system deps on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          apt-get update
          apt-get install -y libopencv-dev tesseract-ocr tesseract-ocr-eng
          tesseract --version

    - name: Install Python deps on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          /var/www/kifu_to_sgf/venv/bin/pip install --upgrade pip
          /var/www/kifu_to_sgf/venv/bin/pip install -e /var/www/kifu_to_sgf/backend

    - name: Restart kifu-backend service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          systemctl daemon-reload
          systemctl restart kifu-backend.service
          systemctl status kifu-backend.service --no-pager